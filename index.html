<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compact Timeline — demo</title>
  <link rel="stylesheet" href="src/timeline.css">
  <style>
    body {
      margin: 0;
      background: #f2f3f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .demo-header {
      max-width: 860px;
      margin: 0 auto;
      padding: 2rem 1rem 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .demo-header h1 {
      font-size: 1.4rem;
      margin: 0;
    }
    .demo-header p {
      margin: 0.25rem 0 0;
      color: #667085;
      font-size: 0.9rem;
    }
    #skin-toggle {
      padding: 0.5rem 1rem;
      border-radius: 999px;
      border: 1px solid #d7dce3;
      background: #ffffff;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
    }
    #timeline {
      background: transparent;
    }
  </style>
</head>
<body>
  <header class="demo-header">
    <div>
      <h1>Compact Timeline</h1>
      <p>Voorbeeldpagina van een eigen, framework-loze verticale tijdlijn-widget.</p>
    </div>
    <button type="button" id="skin-toggle">Donker thema</button>
  </header>

  <div id="timeline" data-skin="light"></div>

    is om een JSON-bestand op te halen via fetch(). Wil je losse data
    laden via fetch, gebruik dan de optie `dataUrl` in plaats van `data`
    (zie README.md) en start een simpele lokale server.

  <script src="src/timeline.js"></script>
  <script>
    var rawData = JSON.parse(document.getElementById('timeline-data').textContent);

    var timeline = new CompactTimeline('#timeline', {
      data: rawData,
      perPage: 4,
      skin: 'light',
      animate: true,
      showFilter: true
    });

    var skinToggle = document.getElementById('skin-toggle');
    skinToggle.addEventListener('click', function () {
      var nextSkin = timeline.options.skin === 'dark' ? 'light' : 'dark';
      timeline.setSkin(nextSkin);
      skinToggle.textContent = nextSkin === 'dark' ? 'Licht thema' : 'Donker thema';
    });
  </script>
</body>
</html>
